name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: MCP bundle is up to date
        run: npm run build:mcp && git diff --exit-code mcp/dist
      - name: Unit tests
        run: npm test
      - name: Eval (offline, committed results — no API key)
        run: npm run eval
      - name: Eval holdout (offline)
        run: npm run eval:holdout --if-present
